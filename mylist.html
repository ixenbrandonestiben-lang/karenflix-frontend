<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KarenFlix - My List</title>
  <link rel="icon" href="public/favicon.ico">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container mylist-page">
    <h1>My List</h1>

    <section class="movie-grid" id="mylist-grid"></section>

    <section class="empty-state" id="mylist-empty" style="display:none;">
      <p class="empty-state__icon">📋</p>
      <p>Your list is empty. Start adding movies!</p>
      <a href="movies.html" class="btn btn--primary">Browse Movies</a>
    </section>

    <section class="empty-state" id="mylist-login" style="display:none;">
      <p class="empty-state__icon">🔒</p>
      <p>Sign in to see your list.</p>
      <a href="login.html" class="btn btn--primary">Sign In</a>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2024 KarenFlix. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module">
    import { initMyListPage } from './assets/js/pages/mylist.js';
    initMyListPage();
  </script>
</body>
</html>
