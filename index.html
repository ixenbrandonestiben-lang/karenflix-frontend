<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KarenFlix - Home</title>
  <link rel="icon" href="public/favicon.ico">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body>
  <header id="navbar"></header>

  <section class="hero" id="hero">
    <div class="hero__backdrop" id="hero-backdrop"></div>
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <h1 id="hero-title"></h1>
      <p id="hero-synopsis"></p>
      <div class="hero__actions">
        <button class="btn btn--primary" id="hero-watch">
          <span>▶</span> Watch Now
        </button>
        <button class="btn btn--secondary" id="hero-add-list">
          <span>+</span> My List
        </button>
      </div>
      <div class="hero__meta" id="hero-meta"></div>
    </div>
  </section>

  <main id="carousels"></main>

  <footer>
    <div class="container">
      <p>© 2024 KarenFlix. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module">
    import { initHomePage } from './assets/js/pages/home.js';
    initHomePage();
  </script>
</body>
</html>
