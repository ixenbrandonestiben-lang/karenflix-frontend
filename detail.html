<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KarenFlix - Movie Detail</title>
  <link rel="icon" href="public/favicon.ico">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/detail.css">
</head>
<body>
  <header id="navbar"></header>

  <header class="detail-hero" id="detail-hero">
    <div class="detail-hero__backdrop" id="detail-backdrop"></div>
    <div class="detail-hero__overlay"></div>
    <div class="detail-hero__content">
      <figure class="detail-hero__poster" id="detail-poster"></figure>
      <div class="detail-hero__info">
        <h1 id="detail-title"></h1>
        <div class="detail-hero__meta" id="detail-meta"></div>
        <div id="detail-rating"></div>
        <p class="detail-hero__synopsis" id="detail-synopsis"></p>
        <div class="detail-hero__actions" id="detail-actions"></div>
      </div>
    </div>
  </header>

  <main class="container detail-content">
    <section class="detail-section">
      <h2 class="detail-section__title">Cast</h2>
      <div class="cast-grid" id="cast-grid"></div>
    </section>

    <section class="detail-section">
      <h2 class="detail-section__title">Reviews</h2>

      <article class="review-form" id="review-form-container">
        <h3>Write a Review</h3>
        <form id="review-form">
          <p class="form__group">
            <label class="form__label" for="review-title-input">Title</label>
            <input type="text" class="form__input" id="review-title-input" placeholder="Review title..." required>
          </p>
          <div class="form__group">
            <span class="form__label">Your Rating</span>
            <div id="review-stars"></div>
            <input type="hidden" id="review-rating-value" value="0">
          </div>
          <p class="form__group">
            <label class="form__label" for="review-comment">Your Review</label>
            <textarea class="form__textarea" id="review-comment" rows="4" placeholder="Share your opinion..." required></textarea>
          </p>
          <button type="submit" class="btn btn--primary">Submit Review</button>
        </form>
      </article>

      <section class="reviews-list" id="reviews-list"></section>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2024 KarenFlix. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module">
    import { initDetailPage } from './assets/js/pages/detail.js';
    initDetailPage();
  </script>
</body>
</html>
